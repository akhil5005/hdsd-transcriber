line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
  "B008",  # FastAPI dependencies are function calls in defaults by design.
]

[lint.per-file-ignores]
"alembic/env.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[lint.isort]
# The repo has a local `alembic/` directory, which would otherwise make ruff
# classify the installed `alembic` package as first-party.
known-third-party = ["alembic"]
known-first-party = ["app"]
